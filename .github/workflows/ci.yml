name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 284228
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      ConnectionStrings__Postgres: "Host=localhost;Port=5432;Database=taskflow;Username=postgres;Password=284228"
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-32b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - name: Unit tests
        run: dotnet test tests/TaskManager.UnitTests --no-build -c Release --logger "trx" --results-directory TestResults
      - name: Integration tests
        run: dotnet test tests/TaskManager.IntegrationTests --no-build -c Release --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: TestResults

  docker-build:
    needs: api-build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}

  deploy-staging:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "Run dotnet ef database update against staging RDS"
      - run: echo "Deploy to ECS Fargate staging cluster"

  deploy-production:
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Run dotnet ef database update against production RDS"
      - run: echo "Deploy to ECS Fargate production cluster"
